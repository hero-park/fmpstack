<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 2440" role="img" aria-labelledby="title desc">
  <title id="title">fmpstack hybrid command hierarchy, narrow layout</title>
  <desc id="desc">The captain directs Firstmate, the sole outer router for dispatch, isolation, supervision, and delivery. Firstmate sends ship and scout workers into isolated copies. Each worker contains the pstack-inspired inner loop: subtract first, name shape and blast radius, walk warranted boundaries, reproduce and trace defects, and prove the real artifact. The supervisor does not receive the inner-loop dump. The hybrid intentionally has no Cursor UI dependency, no second router, and no extra review or shipping ceremony.</desc>
  <defs>
    <marker id="arrow-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64e6d4"/>
    </marker>
    <marker id="arrow-lime" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#d6f76a"/>
    </marker>
    <style>
      .bg { fill: #0b1320; }
      .panel { fill: #111f30; stroke: #30475b; stroke-width: 2; }
      .outer { fill: #102b36; stroke: #64e6d4; stroke-width: 2.5; }
      .worker { fill: #151f2d; stroke: #4d6478; stroke-width: 2; }
      .inner { fill: #1d2a25; stroke: #d6f76a; stroke-width: 2; stroke-dasharray: 8 6; }
      .omit { fill: #211f2a; stroke: #856a8e; stroke-width: 2; }
      .captain { fill: #efe5c6; stroke: #f3c86a; stroke-width: 2; }
      .chip-teal { fill: #174f58; stroke: #64e6d4; stroke-width: 1.5; }
      .chip-lime { fill: #33411e; stroke: #d6f76a; stroke-width: 1.5; }
      .chip-muted { fill: #1a2b3c; stroke: #50677b; stroke-width: 1.5; }
      .title { fill: #f6f8fb; font: 700 27px Arial, Helvetica, sans-serif; letter-spacing: -0.5px; }
      .subtitle { fill: #a9bac8; font: 400 16px Arial, Helvetica, sans-serif; }
      .eyebrow { fill: #8ba4b5; font: 700 13px Arial, Helvetica, sans-serif; letter-spacing: 1.5px; }
      .label { fill: #f6f8fb; font: 700 21px Arial, Helvetica, sans-serif; }
      .label-teal { fill: #64e6d4; font: 700 21px Arial, Helvetica, sans-serif; }
      .label-lime { fill: #d6f76a; font: 700 16px Arial, Helvetica, sans-serif; }
      .body { fill: #c5d2dd; font: 400 16px Arial, Helvetica, sans-serif; }
      .body-strong { fill: #f6f8fb; font: 700 15px Arial, Helvetica, sans-serif; }
      .body-muted { fill: #9fb0bf; font: 400 14px Arial, Helvetica, sans-serif; }
      .step-num { fill: #0b1320; font: 700 13px Arial, Helvetica, sans-serif; }
      .step-title { fill: #e7f6a4; font: 700 15px Arial, Helvetica, sans-serif; }
      .step-body { fill: #b9c9b0; font: 400 14px Arial, Helvetica, sans-serif; }
      .omit-title { fill: #f2d8ee; font: 700 16px Arial, Helvetica, sans-serif; }
      .omit-body { fill: #c5b5c5; font: 400 14px Arial, Helvetica, sans-serif; }
      .line { stroke: #607b8f; stroke-width: 2; fill: none; }
      .line-teal { stroke: #64e6d4; stroke-width: 2.5; fill: none; }
    </style>
  </defs>

  <rect class="bg" width="480" height="2440" rx="20"/>

  <text x="28" y="48" class="eyebrow">FMPSTACK / HYBRID BOUNDARY</text>
  <text x="28" y="88" class="title">Firstmate outside.</text>
  <text x="28" y="120" class="title">Worker discipline inside.</text>
  <text x="28" y="151" class="subtitle">One command hierarchy, with a pstack-inspired loop</text>
  <text x="28" y="173" class="subtitle">nested only where code work happens.</text>

  <rect x="40" y="205" width="400" height="94" rx="24" class="captain"/>
  <text x="240" y="243" text-anchor="middle" fill="#182331" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700">CAPTAIN AUTHORITY</text>
  <text x="240" y="270" text-anchor="middle" fill="#46515c" font-family="Arial, Helvetica, sans-serif" font-size="15">intent, product decisions, credentials, merge</text>
  <path d="M240 299 V328" class="line-teal" marker-end="url(#arrow-teal)"/>

  <rect x="20" y="328" width="440" height="485" rx="18" class="outer"/>
  <text x="42" y="361" class="eyebrow" fill="#8fece0">OUTER CONTROL PLANE / ONE ROUTER</text>

  <rect x="42" y="382" width="396" height="195" rx="12" class="panel"/>
  <text x="64" y="417" class="label-teal">FIRSTMATE</text>
  <text x="64" y="443" class="body">The sole outer router for the fleet.</text>
  <rect x="64" y="462" width="166" height="38" rx="19" class="chip-teal"/>
  <text x="147" y="487" text-anchor="middle" class="body-strong">DISPATCH</text>
  <rect x="250" y="462" width="166" height="38" rx="19" class="chip-teal"/>
  <text x="333" y="487" text-anchor="middle" class="body-strong">ISOLATE</text>
  <rect x="64" y="510" width="166" height="38" rx="19" class="chip-teal"/>
  <text x="147" y="535" text-anchor="middle" class="body-strong">SUPERVISE</text>
  <rect x="250" y="510" width="166" height="38" rx="19" class="chip-teal"/>
  <text x="333" y="535" text-anchor="middle" class="body-strong">DELIVER</text>
  <text x="64" y="566" class="body-muted">Briefs, isolated copies, fleet watch, and delivery.</text>

  <rect x="42" y="594" width="396" height="191" rx="12" class="panel"/>
  <text x="64" y="628" class="label">SUPERVISOR</text>
  <text x="64" y="654" class="body">Fleet view, not code-face work.</text>
  <rect x="64" y="672" width="300" height="38" rx="19" class="chip-muted"/>
  <text x="214" y="697" text-anchor="middle" class="body-strong">NO PSTACK DUMP HERE</text>
  <text x="64" y="740" class="body-muted">No pstack playbook enters always-on rules.</text>
  <text x="64" y="762" class="body-muted">The inner loop stays inside workers.</text>

  <path d="M240 813 V838" class="line" marker-end="url(#arrow-lime)"/>

  <rect x="20" y="858" width="440" height="531" rx="16" class="worker"/>
  <text x="42" y="894" class="label">SHIP WORKER</text>
  <text x="42" y="920" class="body">Changes the product in one isolated copy.</text>
  <rect x="40" y="946" width="400" height="350" rx="12" class="inner"/>
  <text x="62" y="977" class="label-lime">WORKER-LOCAL / PSTACK-INSPIRED</text>
  <text x="62" y="998" class="label-lime">INNER LOOP</text>
  <circle cx="70" cy="1033" r="13" fill="#d6f76a"/><text x="70" y="1038" text-anchor="middle" class="step-num">1</text>
  <text x="96" y="1031" class="step-title">SUBTRACT FIRST</text>
  <text x="96" y="1051" class="step-body">Smallest logical change that meets the task.</text>
  <circle cx="70" cy="1083" r="13" fill="#d6f76a"/><text x="70" y="1088" text-anchor="middle" class="step-num">2</text>
  <text x="96" y="1081" class="step-title">NAME SHAPE + BLAST RADIUS</text>
  <text x="96" y="1101" class="step-body">Input, state, output, files, boundaries.</text>
  <circle cx="70" cy="1133" r="13" fill="#d6f76a"/><text x="70" y="1138" text-anchor="middle" class="step-num">3</text>
  <text x="96" y="1131" class="step-title">WALK IF WARRANTED</text>
  <text x="96" y="1151" class="step-body">Shared or unfamiliar boundary, or diagnosis.</text>
  <circle cx="70" cy="1183" r="13" fill="#d6f76a"/><text x="70" y="1188" text-anchor="middle" class="step-num">4</text>
  <text x="96" y="1181" class="step-title">REPRODUCE + TRACE</text>
  <text x="96" y="1201" class="step-body">Reproduce defects before changing; trace causes.</text>
  <circle cx="70" cy="1233" r="13" fill="#d6f76a"/><text x="70" y="1238" text-anchor="middle" class="step-num">5</text>
  <text x="96" y="1231" class="step-title">PROVE THE REAL ARTIFACT</text>
  <text x="96" y="1251" class="step-body">Live command, flow, record, focused verifier.</text>
  <rect x="40" y="1310" width="400" height="32" rx="16" class="chip-lime"/>
  <text x="60" y="1332" class="body-strong" fill="#e7f6a4">OUTPUT: code + commit -&gt; delivery path</text>

  <path d="M240 1389 V1414" class="line" marker-end="url(#arrow-lime)"/>

  <rect x="20" y="1434" width="440" height="531" rx="16" class="worker"/>
  <text x="42" y="1470" class="label">SCOUT WORKER</text>
  <text x="42" y="1496" class="body">Finds the truth in one isolated copy.</text>
  <text x="42" y="1518" class="body">It reports evidence without shipping code.</text>
  <rect x="40" y="1544" width="400" height="350" rx="12" class="inner"/>
  <text x="62" y="1575" class="label-lime">WORKER-LOCAL / PSTACK-INSPIRED</text>
  <text x="62" y="1596" class="label-lime">INNER LOOP</text>
  <circle cx="70" cy="1631" r="13" fill="#d6f76a"/><text x="70" y="1636" text-anchor="middle" class="step-num">1</text>
  <text x="96" y="1629" class="step-title">SUBTRACT FIRST</text>
  <text x="96" y="1649" class="step-body">Smallest investigation that answers the ask.</text>
  <circle cx="70" cy="1681" r="13" fill="#d6f76a"/><text x="70" y="1686" text-anchor="middle" class="step-num">2</text>
  <text x="96" y="1679" class="step-title">NAME SHAPE + BLAST RADIUS</text>
  <text x="96" y="1699" class="step-body">Input, state, output, files, boundaries.</text>
  <circle cx="70" cy="1731" r="13" fill="#d6f76a"/><text x="70" y="1736" text-anchor="middle" class="step-num">3</text>
  <text x="96" y="1729" class="step-title">WALK IF WARRANTED</text>
  <text x="96" y="1749" class="step-body">Shared or unfamiliar boundary, or diagnosis.</text>
  <circle cx="70" cy="1781" r="13" fill="#d6f76a"/><text x="70" y="1786" text-anchor="middle" class="step-num">4</text>
  <text x="96" y="1779" class="step-title">REPRODUCE + TRACE</text>
  <text x="96" y="1799" class="step-body">Reproduce defects before changing; trace causes.</text>
  <circle cx="70" cy="1831" r="13" fill="#d6f76a"/><text x="70" y="1836" text-anchor="middle" class="step-num">5</text>
  <text x="96" y="1829" class="step-title">PROVE THE REAL ARTIFACT</text>
  <text x="96" y="1849" class="step-body">Commands, records, and focused evidence.</text>
  <rect x="40" y="1908" width="400" height="32" rx="16" class="chip-lime"/>
  <text x="60" y="1930" class="body-strong" fill="#e7f6a4">OUTPUT: report + gaps -&gt; never permission to build</text>

  <text x="28" y="2020" class="eyebrow">INTENTIONAL OMISSIONS / SMALL BOUNDARY</text>
  <rect x="20" y="2050" width="440" height="98" rx="12" class="omit"/>
  <text x="42" y="2082" class="omit-title">NO CURSOR UI DEPENDENCY</text>
  <text x="42" y="2110" class="omit-body">The worker loop is harness-neutral.</text>
  <rect x="20" y="2168" width="440" height="98" rx="12" class="omit"/>
  <text x="42" y="2200" class="omit-title">NO SECOND ROUTER</text>
  <text x="42" y="2228" class="omit-body">Firstmate alone chooses and delivers work.</text>
  <rect x="20" y="2286" width="440" height="112" rx="12" class="omit"/>
  <text x="42" y="2318" class="omit-title">NO EXTRA REVIEW OR SHIPPING</text>
  <text x="42" y="2346" class="omit-body">The selected delivery path owns both.</text>
</svg>
